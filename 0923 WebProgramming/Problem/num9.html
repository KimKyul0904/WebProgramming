<!DOCTYPE html>
<html>
    <head>
        <title>Most-Shadow와 Box-Shadow</title>
        <style>
            h2 {
                text-align: center;
                text-shadow: 5px 5px 5px  gray;
            }
            img {
                width: 100px;
                height: 100px;
            }
            img:hover {
                box-shadow: 5px 5px 5px 5px black;
            }
           
        </style>
    </head>

        <hr>
