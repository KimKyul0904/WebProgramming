<!DOCTYPE html>
<html>
    <head><meta charset="UTF-8">
    <title>색 테이블 만들기</title>
    <style>
        table, th, td {
            border : 1px solid black;
            border-collapse: collapse;
        }
        table {
            width : 120%;
            table-layout: fixed;
        }
        th {
            font-size: 15px;
        }
    </style>
</head>
<body> 
    <h2>색 이름과 코드</h2>
    <hr>
    <table>
        <tr>
            <th>이름</th>
            <th>코드</th>
            <th>색</th>
            <th>이름</th>
            <th>코드</th>
            <th>색</th>
        </tr>
        <tr>
            <th>Brown</th>
            <th>#A52A2A</th>
            <th style="background-color: #a52a2a;"></th>
            <th>DeepSkyBlue</th>
            <th>#00BFFF</th>
            <th style="background-color: #00BFFF;"></th>
        </tr>
        <tr>
            <th>DarkOrange</th>
            <th>#FF8C00</th>
            <th style="background-color: #FF8C00;"></th>
            <th>OliveDrab</th>
            <th>#6B8E23</th>
            <th style="Background-color: #6B8E23"></th>
        </tr>
    </table>
</body>
</html>
