<!DOCTYPE html>
<html>
    <meta charset="utf-8">
    <head>
        <title>animation</title>
        <style>
            @keyframes rotation{
                    from{transform: rotate(-90deg);}
                    to{transform: rotate(+90deg);}
            }
            img {
                    animation-name: rotation;
                    animation-duration: 1s;
                    animation-iteration-count: infinite;
            }
        </style>
    </head>
    <body>
        <h1>어지러워요</h1>
        <hr>
        <img src="/Users/kyul/Desktop/WebpProgramming/spongesquid.png" width="150" height="150">
    </body>
</html>
